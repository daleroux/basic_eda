---
- name: Simple rulebook example that launch DJT and pass extra_var for the survey
  hosts: localhost
  sources:
    - name: listen for alerts
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5005
  rules:
    - name: with any payload received launch DJT and pass extra_var for the survey
      condition: event.payload is defined
      action:
        run_job_template:
          name: "DJT"
          organization: "Default"
          job_args:
            extra_vars:
              color: "white"
