---
- name: Simple rulebook example that prints the payload received
  hosts: localhost
  sources:
    - name: listen for alerts
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5005
  rules:
    - name: Print any payload received
      condition: event.payload.alert_type is defined
      throttle:
        once_within: 5 seconds
        group_by_attributes:
          - event.payload.alert_type
      action:
        debug:
          msg: "Received alert: type={{ event.payload.alert_type }}, source={{ event.payload.source | default('unknown') }}"
